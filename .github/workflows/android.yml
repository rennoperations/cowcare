name: Build APK Android

on:
  push:
    branches: [ main, master ]
    paths: [ "web/**", "android/**", ".github/workflows/android.yml" ]
  release:
    types: [ published ]
  pull_request:
    paths: [ "web/**", "android/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/CowCare-debug.apk
          cp app/build/outputs/apk/release/app-release.apk ../dist/CowCare.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CowCare-apk
          path: dist/*.apk

      - name: Lampirkan APK ke halaman Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CowCare.apk
